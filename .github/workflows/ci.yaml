name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies and tools
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8 pytest bandit

      - name: Run flake8 (Syntax Check Only)
        run: |
          # Σταματάει το build μόνο αν υπάρχουν Python syntax errors ή undefined variables.
          # Αγνοεί τα formatting micro-errors (PEP8) για να μην σπάει άδικα το CI.
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,.venv,env,ENV,__pycache__

      - name: Run Bandit security scan
        run: |
          # Εκτελεί το security scan μεμονωμένα. Αν βρει warnings δεν κρασάρει το build (επιτρέπει exit code 0)
          bandit -r . --exclude ./venv,./.venv,./tests -ll || true

      - name: Run tests
        run: |
          # Εκτέλεση των tests αν υπάρχουν, χωρίς να κρασάρει η υποδομή αν δεν βρει αρχεία
          PYTHONPATH=. pytest -v --maxfail=1 --disable-warnings || echo "No tests specified or completed"
