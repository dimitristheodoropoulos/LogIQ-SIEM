name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies and tools
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8 pytest bandit

      - name: Run flake8 (Syntax Check Only)
        run: |
          # Σταματάει το build μόνο αν υπάρχουν σοβαρά Python syntax errors.
          # Εξαιρούμε ρητά τους φακέλους backup για να μην επηρεάζουν το CI.
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,.venv,env,ENV,__pycache__,backup_logiq,tests_backup

      - name: Run Bandit security scan
        run: |
          # Security scan στην ενεργή εφαρμογή (εξαιρούμε τα backups)
          bandit -r . --exclude ./venv,./.venv,./tests,./backup_logiq,./tests_backup -ll || true

      - name: Run tests
        run: |
          PYTHONPATH=. pytest -v --maxfail=1 --disable-warnings || echo "No tests specified or completed"
